    --display: 'Black Han Sans', 'Pretendard Variable', sans-serif;
    --text: 'Pretendard Variable', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: var(--text); color: var(--ink); background: var(--paper); }
  .grid-bg {
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; z-index: 999; font-size: 15px; max-width: 90vw; }

  /* ───────── 진행자 화면 ───────── */
  .host { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .h-head { background: linear-gradient(90deg, rgba(16,41,74,.82) 0%, rgba(16,41,74,.5) 45%, rgba(16,41,74,.12) 100%), var(--campus) center 40% / cover; }
  .h-top .h-stat, .h-title { text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .h-top { display: flex; align-items: baseline; gap: 20px; padding: 14px 32px 10px; color: #fff; }
  .h-title { font-family: var(--display); font-size: 24px; letter-spacing: .5px; white-space: nowrap; }
  .h-stat { margin-left: auto; display: flex; gap: 26px; font-size: 17px; color: #B9C8DD; white-space: nowrap; }
  .h-stat b { font-family: var(--display); font-weight: 400; color: #fff; font-size: 30px; margin-left: 6px; }
  .h-q { display: flex; align-items: center; gap: 28px; padding: 10px 32px 30px; min-height: 150px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.6), 0 0 2px rgba(0,0,0,.5); }
  .h-qno { font-family: var(--display); font-size: 40px; color: var(--gold); white-space: nowrap; }
  .h-qtext { flex: 1; font-size: clamp(28px, 3.3vw, 54px); font-weight: 800; line-height: 1.28; word-break: keep-all; letter-spacing: -.5px; }
  .h-timer { font-family: var(--display); font-size: 92px; line-height: 1; min-width: 120px; text-align: right; color: var(--gold); flex: none; }
  .h-timer.warn { color: #FF6B78; }
  .timebar { height: 12px; background: rgba(16,41,74,.9); }
  .timebar i { display: block; height: 100%; width: 0; background: var(--gold); }
  .timebar i.warn { background: #FF6B78; }

  .arena { position: relative; flex: 1; overflow: hidden; background: var(--grass-c) var(--grass); }
  .zone { position: absolute; top: 0; bottom: 0; display: grid; place-items: center; transition: box-shadow .3s, filter .4s; }
  .zone.o { left: 0; width: 42%; }
  .zone.x { right: 0; width: 42%; }
  .zone.mid { left: 42%; width: 16%; background: rgba(255,255,255,.08); border-left: 4px dashed rgba(255,255,255,.75); border-right: 4px dashed rgba(255,255,255,.75); }
  .zone .glyph { font-family: var(--display); font-size: min(34vw, 52vh); line-height: 1; opacity: .12; user-select: none; }
  .zone.o .glyph { color: var(--o); } .zone.x .glyph { color: var(--x); }
  .zone.mid .glyph { font-family: var(--text); font-size: 17px; font-weight: 800; opacity: 1; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.35); align-self: start; margin-top: 16px; }
  .zone .cnt { position: absolute; top: 14px; font-family: var(--display); font-size: 52px; line-height: 1; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 6px 18px 2px; z-index: 15; }
  .zone .cnt:empty { display: none; }
  .zone .cnt small { font-family: var(--text); font-size: 22px; font-weight: 700; margin-left: 4px; }
  .zone.o .cnt { color: var(--o); } .zone.x .cnt { color: var(--x); }
  .zone .glyph-img { width: min(30vw, 46vh); opacity: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.08)); transition: opacity .4s, transform .4s; user-select: none; pointer-events: none; }
  .zone.correct .glyph-img { opacity: 1; transform: scale(1.06); }

    // 참가자: 기기마다 무작위 ID + 비밀 열쇠(본인 기록만 고칠 수 있게)
    const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnopqrstuvwxyz23456789'[b % 33]).join('');
    uid = localStorage.getItem('ox_pid') || rnd(20); localStorage.setItem('ox_pid', uid);
    key = localStorage.getItem('ox_key') || rnd(24); localStorage.setItem('ox_key', key);
  }
  const gameRef = F.doc(db, 'games', GAME_ID);
  const playersCol = F.collection(db, 'games', GAME_ID, 'players');
  const onErr = e => { console.error(e); toast('연결 오류: ' + (e.code || e.message)); };
  return {
    mode: 'firebase', uid,
    watchGame: cb => F.onSnapshot(gameRef, s => cb(s.exists() ? s.data() : null), onErr),
    setGame: d => F.setDoc(gameRef, { ...d, hostUid: uid }).catch(e => {
      onErr(e);
      if (e.code === 'permission-denied') toast('이 게임 방은 다른 기기가 진행 중이에요. GAME_ID를 바꾸거나 콘솔에서 게임 문서를 지워주세요.', 8000);
    }),
    watchPlayers: cb => F.onSnapshot(playersCol, s => { const m = {}; s.forEach(d => m[d.id] = d.data()); cb(m); }, onErr),
    savePlayer: d => F.setDoc(F.doc(playersCol, uid), { ...d, k: key }, { merge: true }).catch(onErr),
    deletePlayer: id => F.deleteDoc(F.doc(playersCol, id)).catch(onErr),
    deleteAllPlayers: async ids => {
      for (let i = 0; i < ids.length; i += 400) {
        const b = F.writeBatch(db);
        ids.slice(i, i + 400).forEach(id => b.delete(F.doc(playersCol, id)));
        await b.commit().catch(onErr);
      }
    },
  };
}

function makeDemoBackend() {
  let uid = sessionStorage.getItem('ox_uid');
  if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('ox_uid', uid); }
  const KG = 'oxdemo_game_' + GAME_ID, KP = 'oxdemo_players_' + GAME_ID;
  const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const subs = { [KG]: [], [KP]: [] };
  const emit = k => subs[k].forEach(cb => cb(k === KP ? (read(k) || {}) : read(k)));
  addEventListener('storage', e => { if (subs[e.key]) emit(e.key); });
  const write = (k, v) => { localStorage.setItem(k, JSON.stringify(v)); emit(k); };
  return {
    mode: 'demo', uid,
    watchGame: cb => { subs[KG].push(cb); setTimeout(() => cb(read(KG))); },
    setGame: async d => write(KG, { ...d, hostUid: uid }),
    watchPlayers: cb => { subs[KP].push(cb); setTimeout(() => cb(read(KP) || {})); },
    savePlayer: async d => { const p = read(KP) || {}; p[uid] = { ...(p[uid] || {}), ...d }; write(KP, p); },
    deletePlayer: async id => { const p = read(KP) || {}; delete p[id]; write(KP, p); },
    deleteAllPlayers: async () => write(KP, {}),
  };
}

/* ═══════════════════════ 참가자 화면 ═══════════════════════ */
function startPlayer(be) {
  let game = null, mySide = null, savedSide = null, saveTimer = null, localLocked = false;
  let moves = 0, movesQ = null, countdown = null, joined = false, firstGame = true;
  const JK = 'ox_joined_' + GAME_ID + be.uid;   // 입장할 때의 '처음으로' 회차를 기억
  let myName = localStorage.getItem('ox_name') || '';
  let myChar = localStorage.getItem('ox_char'); myChar = myChar == null ? (Math.random() * CHARS.length | 0) : (+myChar % CHARS.length);

  const root = h('div', 'player'); app.append(root);

  const amAlive = () => !game || !game.alive || game.alive.includes(be.uid);
  // 이번 판(처음으로 회차)에 참가했던 적이 있는지 기억 → 새로고침해도 '탈락' / '관전' 구분
  const playedKey = () => 'ox_played_' + GAME_ID + '_' + be.uid + '_' + ((game && game.resetAt) || 0);
  const played = () => !!localStorage.getItem(playedKey()) || ((game && game.prevAlive) || []).includes(be.uid);

  function flush() {
    clearTimeout(saveTimer); saveTimer = null;
    if (savedSide === mySide) return;
    savedSide = mySide; moves++;
    be.savePlayer({ side: mySide, t: Date.now() });
  }
  function choose(side) {
    if (!game || game.phase !== 'question' || localLocked || !amAlive()) return;
    if (movesQ !== game.qNo) { movesQ = game.qNo; moves = 0; }
    if (moves >= MAX_MOVES_PER_QUESTION) { toast('이번 문제는 이동 횟수를 다 썼어요!'); return; }
    if (side === mySide) return;
    mySide = side; render();
    clearTimeout(saveTimer); saveTimer = setTimeout(flush, 350);  // 빠르게 왔다갔다하면 마지막 위치만 저장
  }

  function renderJoin() {
    root.innerHTML = '';
    const w = h('div', 'p-join');
    w.append(h('h1', null, EVENT_TITLE));
    w.append(h('p', null, '캐릭터와 이름을 정하면 큰 화면에 내 캐릭터가 나타나요.'));
    w.append(h('div', 'p-label', '캐릭터 고르기'));
    const pick = h('div', 'p-pick');
    CHARS.forEach((ch, i) => {
      const b = h('button', i === myChar ? 'on' : '');
      b.type = 'button'; b.setAttribute('aria-pressed', i === myChar);
      b.append(charImg(i), document.createTextNode(ch.name));
      b.onclick = () => { myChar = i; pick.querySelectorAll('button').forEach((x, j) => { x.classList.toggle('on', j === i); x.setAttribute('aria-pressed', j === i); }); };
      pick.append(b);
    });
    w.append(pick);
    w.append(h('div', 'p-label', '이름'));
    const inp = h('input'); inp.maxLength = 12; inp.placeholder = '이름 (예: 홍길동)'; inp.value = myName;
    const btn = h('button', null, '입장하기');
    const go = () => {
      const name = inp.value.trim().slice(0, 12);
      if (!name) { inp.focus(); return; }
      myName = name; localStorage.setItem('ox_name', name); localStorage.setItem('ox_char', myChar);
      localStorage.setItem(JK, String((game && game.resetAt) || 0)); joined = true;
      be.savePlayer({ name, c: myChar, side: null, t: Date.now() }); savedSide = null; mySide = null;
      render();
    };
    btn.onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    w.append(inp, btn);
    root.append(w);
    setTimeout(() => inp.focus(), 50);
  }

  function badge() {
    const alive = amAlive();
    return h('span', 'p-badge ' + (alive ? 'alive' : 'dead'), alive ? '생존' : '관전 중');
  }

  function center(big, sub, extra, tone) {
    root.className = 'player' + (tone ? ' tone-' + tone : '');
    const c = h('div', 'p-center');
    if (joined) c.append(charImg(myChar, 'av'));
    c.append(h('div', 'big', big));
    if (sub) c.append(h('div', 'sub', sub));
    if (extra) c.append(extra);
    return c;
  }

  function render() {
    root.className = 'player';
    if (!joined) return renderJoin();
    root.innerHTML = '';
    const foot = h('div', 'p-foot'); foot.append(document.createTextNode(myName + '  '), badge());

    if (!game) { root.append(center('잠시만요', '진행자가 아직 게임을 열지 않았어요.'), foot); return; }

    const ph = game.phase === 'question' && localLocked ? 'locked' : game.phase;
    if (ph === 'lobby') {
      root.append(center('입장 완료', '곧 시작해요.\n화면을 켜둔 채로 기다려 주세요.'), foot);
      return;
    }
    if (ph === 'final') {
      const win = (game.winners || []).some(w => w.uid === be.uid);
      root.append(center(win ? '우승!' : '수고하셨어요', win ? '최후의 생존자예요. 축하해요!' : '우승자는 큰 화면에서 확인하세요.', null, win ? 'win' : null), foot);
      return;
    }
    if (ph === 'reveal') {
      const alive = amAlive();
      const wasIn = (game.prevAlive || []).includes(be.uid) || !game.prevAlive;
      let big, sub, tone = null;
      if (game.allWrong) { big = '전원 오답'; sub = '모두 틀려서 아무도 탈락하지 않아요.'; }
      else if (alive) { big = '정답!'; sub = `정답은 ${game.answer}. 다음 문제도 살아남으세요!`; tone = 'ok'; }
      else if (wasIn) { big = '탈락'; sub = `정답은 ${game.answer}였어요.\n큰 화면을 보며 계속 함께해요.`; tone = 'out'; }
      else { big = `정답 ${game.answer}`; sub = '관전 중이에요.'; }
      root.append(center(big, sub, null, tone), foot);
      return;
    }

    // question / locked
    const head = h('div', 'p-head');
    const pq = h('div', 'p-q'); pq.append(h('b', null, 'Q' + game.qNo), document.createTextNode(game.qText || ''));
    head.append(pq);
    const tm = h('div', 'p-timer' + (ph === 'locked' ? ' done' : ''), ph === 'locked' ? '마감' : '');
    head.append(tm);
    if (game.alive && amAlive()) localStorage.setItem(playedKey(), '1');
    if (!amAlive()) {
      const out = played();
      const c = center(out ? '탈락' : '관전 중',
        out ? '아쉽지만 탈락했어요.\n큰 화면을 보며 정답을 맞혀보세요.' : '게임이 이미 시작돼서\n이번 판은 관전만 할 수 있어요.', null, out ? 'out' : null);
      root.append(head, c, foot);
      return;
    }
    const sides = h('div', 'p-sides' + (ph !== 'question' || !amAlive() ? ' disabled' : '') + (mySide ? ' has-sel' : ''));
    ['O', 'X'].forEach(s => {
      const b = h('button', 'p-side ' + s.toLowerCase() + (mySide === s ? ' sel' : ''));
      const mk = document.createElement('img'); mk.className = 'mark'; mk.src = markSrc(s); mk.alt = s; b.append(mk);
      const me = h('div', 'me'); me.append(charImg(myChar), h('span', null, myName)); b.append(me);
      b.onpointerdown = () => choose(s);
      sides.append(b);
    });
    if (ph === 'question' && !mySide) { foot.innerHTML = ''; foot.append(document.createTextNode('O 또는 X를 눌러 이동하세요')); }
    root.append(head, sides, foot);

    if (ph === 'question') {
      clearInterval(countdown);
      const tick = () => {
        const left = Math.max(0, Math.ceil((game._endLocal - Date.now()) / 1000));
        tm.textContent = left; tm.classList.toggle('warn', left <= 3);
        if (left <= 0) { clearInterval(countdown); if (!localLocked) { localLocked = true; flush(); render(); } }
      };
      tick(); countdown = setInterval(tick, 200);
    }
  }

  be.watchGame(g => {
    const prev = game;
    game = g;
    if (g && g.phase === 'question' && (!prev || prev.phase !== 'question' || prev.qNo !== g.qNo)) {
      game._endLocal = Date.now() + (g.duration || QUESTION_SECONDS) * 1000;   // 받은 시점부터 카운트
      localLocked = false;
    } else if (g && prev && prev._endLocal && g.phase === 'question') game._endLocal = prev._endLocal;
    if (g && g.phase === 'locked') flush();   // 마감 직전 이동분 즉시 저장
    const epoch = String((g && g.resetAt) || 0);
    if (firstGame) {
      // 새로고침: 같은 회차에 이미 입장했으면 이어서 참가 (가운데에서 다시 시작)
      firstGame = false;
      if (joined) localStorage.setItem(JK, epoch);   // 게임 정보 받기 전에 입장한 경우
      else if (localStorage.getItem(JK) === epoch && myName) { joined = true; be.savePlayer({ name: myName, c: myChar, side: null, t: Date.now() }); }
    } else if (joined && localStorage.getItem(JK) !== epoch) {
      // 진행자가 '처음으로'를 눌러 참가자 명단이 지워짐 → 다시 입장
      joined = false; mySide = null; savedSide = null; localStorage.removeItem(JK);
      toast('게임이 새로 시작됐어요. 이름을 다시 입력해 주세요!');
    }
    render();
  });
}

/* ═══════════════════════ 진행자 화면 ═══════════════════════ */
function startHost(be) {
  let game = null, players = {}, bots = {}, lockedSides = null, timer = null, endAt = 0;
  let questions = parseQ(localStorage.getItem('ox_questions_' + GAME_ID) || DEFAULT_QUESTIONS);

  function parseQ(txt) {
    return txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const m = l.match(/^([OXox○×])\s*[|.:)\-]?\s*(.+)$/);
      if (!m) return null;
      return { answer: /[Oo○]/.test(m[1]) ? 'O' : 'X', text: m[2].trim() };
    }).filter(Boolean);
  }

  /* 화면 뼈대 */
  app.innerHTML = `
  <div class="host">
    <div class="h-head">
    <div class="h-top">
      <div class="h-title"></div>
      <div class="h-stat"><span>참가 <b id="nAll">0</b></span><span>생존 <b id="nAlive">0</b></span></div>
    </div>
    <div class="h-q"><div class="h-qno" id="qno"></div><div class="h-qtext" id="qtext"></div><div class="h-timer hidden" id="timer"></div></div>
    <div class="timebar"><i id="tbar"></i></div>
    </div>
    <div class="arena lobby" id="arena">
      <div class="zone o" id="zO"><img class="glyph-img" alt="O"><div class="cnt" id="cO"></div></div>
      <div class="zone mid" id="zM"><div class="glyph">아직 안 고름</div></div>
      <div class="zone x" id="zX"><img class="glyph-img" alt="X"><div class="cnt" id="cX"></div></div>
      <div class="lobby-card" id="lobbyCard">
        <h2>폰 카메라로<br>QR을 찍으세요</h2>
        <div class="qr" id="qr"></div>
        <div class="url" id="url"></div>
        <div class="cnt-label">지금까지 입장</div>
        <div class="big" id="lobbyCnt">0</div>
      </div>
    </div>
    <div class="h-bar">
      <button class="primary" id="bMain"></button>
      <span class="msg" id="msg"></span>
      <span class="spacer"></span>
      <button id="bFinal">🏆 우승자 발표</button>
      <button id="bRevive">패자부활(전원)</button>
      <button id="bEdit">문제 편집</button>
      <button id="bBots">가상 참가자 +50</button>
      <button id="bReset">처음으로</button>
    </div>
  </div>`;
  $('.h-title').textContent = EVENT_TITLE + (be.mode === 'demo' ? ' (데모)' : '') + (ROOM ? ' (방: ' + ROOM + ')' : '');

  $('#zO .glyph-img').src = markSrc('O'); $('#zX .glyph-img').src = markSrc('X');
  const joinUrl = location.origin + location.pathname + (ROOM ? '?room=' + ROOM : '');
  $('#url').textContent = joinUrl;
  (function drawQR(n = 0) {
    if (window.qrcode) {
      const q = qrcode(0, 'M'); q.addData(joinUrl); q.make();
      $('#qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    } else if (n < 40) setTimeout(() => drawQR(n + 1), 250);
    else $('#qr').innerHTML = `<img alt="QR" style="width:100%;max-width:320px" src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=${encodeURIComponent(joinUrl)}">`;
  })();

  const arena = $('#arena');
  const allPlayers = () => ({ ...players, ...bots });
  const aliveList = () => game && game.alive ? game.alive : Object.keys(allPlayers());
  const isAlive = id => !game || !game.alive || game.alive.includes(id);

  /* 상태 저장 */
  function save(patch) {
    const next = { title: EVENT_TITLE, phase: 'lobby', qNo: 0, qText: '', answer: null, alive: null, duration: QUESTION_SECONDS, ...game, ...patch };
    delete next.hostUid; delete next._endLocal;
    game = { ...next };
    be.setGame(next);
    render();
  }

  /* 진행 동작 */
  function ask() {
    const qi = game.qNo;   // 다음 문제 인덱스 = 현재 번호
    if (qi >= questions.length) { toast('준비된 문제를 모두 냈어요. 우승자를 발표하거나 문제를 추가하세요.'); return; }
    const q = questions[qi];
    const alive = game.alive || Object.keys(allPlayers());   // 첫 문제: 지금 들어온 사람 전원 참가
    lockedSides = null;
    endAt = Date.now() + QUESTION_SECONDS * 1000;
    save({ phase: 'question', qNo: qi + 1, qText: q.text, answer: null, alive, prevAlive: null, allWrong: false });
    clearInterval(timer);
    timer = setInterval(() => {
      const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      const t = $('#timer'); t.textContent = left; t.classList.toggle('warn', left <= 3);
      const bar = $('#tbar'); bar.style.width = Math.max(0, (endAt - Date.now()) / (QUESTION_SECONDS * 1000) * 100) + '%'; bar.classList.toggle('warn', left <= 3);
      if (left <= 0) { clearInterval(timer); lock(false); }
    }, 100);
  }
  function lock(manual) {
    clearInterval(timer);
    if (manual) save({ phase: 'locked' });          // 조기 마감: 참가자에게 알림
    else { game = { ...game, phase: 'locked' }; render(); }   // 자동 마감: 참가자 폰도 10초 뒤 스스로 마감(서버 사용량 절약)
    $('#msg').textContent = '마감! 마지막 이동을 집계하는 중…';
    setTimeout(() => { snapshotSides(); render(); $('#msg').textContent = '집계 완료 — Space로 정답 공개'; }, 1200);   // 마감 직전 전송분 받을 여유
  }
  function snapshotSides() {
    const all = allPlayers();
    lockedSides = {};
    (game.alive || []).forEach(id => lockedSides[id] = all[id] ? (all[id].side || null) : null);
  }
  function reveal() {
    if (!lockedSides) snapshotSides();
    const q = questions[game.qNo - 1];
    const prevAlive = game.alive || [];
    let alive = prevAlive.filter(id => lockedSides[id] === q.answer);
    const allWrong = alive.length === 0 && prevAlive.length > 0;
    if (allWrong) alive = prevAlive.slice();
    save({ phase: 'reveal', answer: q.answer, alive, prevAlive, allWrong });
    // 탈락 애니메이션
    if (!allWrong) prevAlive.forEach(id => { if (!alive.includes(id) && chips[id]) { chips[id].el.classList.add('out'); chips[id].dying = Date.now(); } });
  }
  function finale() {
    const all = allPlayers();
    const winners = aliveList().filter(id => all[id]).map(id => ({ uid: id, name: all[id].name, c: all[id].c || 0 }));
    save({ phase: 'final', winners });
  }

  /* 버튼 */
  const bMain = $('#bMain');
  bMain.onclick = () => {
    if (!game) return;
    const ph = game.phase;
    if (ph === 'lobby' || ph === 'reveal') ask();
    else if (ph === 'question') lock(true);
    else if (ph === 'locked') reveal();
    else if (ph === 'final') save({ phase: 'reveal' });
  };
  addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); bMain.click(); }
  });
  $('#bFinal').onclick = () => finale();
  $('#bRevive').onclick = () => {
    if (!confirm('지금 접속한 모든 참가자를 다시 살릴까요?')) return;
    save({ alive: Object.keys(allPlayers()), allWrong: false });
    toast('전원 부활!');
  };
  $('#bReset').onclick = () => {
    const n = Object.keys(allPlayers()).length;
    if (!confirm(`게임을 처음(대기 화면)으로 되돌릴까요?\n참가자 ${n}명이 모두 지워지고, 참가자들은 이름을 다시 입력해야 해요.`)) return;
    clearInterval(timer); lockedSides = null;
    be.deleteAllPlayers(Object.keys(players));
    players = {}; bots = {};
    save({ phase: 'lobby', qNo: 0, qText: '', answer: null, alive: null, prevAlive: null, allWrong: false, winners: null, resetAt: Date.now() });
  };
  $('#bBots').onclick = () => {
    const fam = '김이박최정강조윤장임한오서신권황안송류홍', given = ['민준', '서연', '도윤', '지우', '하준', '서윤', '은우', '지민', '예준', '수아', '시우', '하은', '주원', '지유', '유준', '채원'];
    for (let i = 0; i < 50; i++) {
      const id = 'bot' + Math.random().toString(36).slice(2, 9);
      bots[id] = { name: fam[Math.random() * fam.length | 0] + given[Math.random() * given.length | 0], side: null, bot: true, c: Math.random() * CHARS.length | 0 };
    }
    if (game && game.alive && game.phase !== 'lobby') toast('가상 참가자는 다음 "처음으로" 또는 패자부활 때 게임에 합류해요');
    render();
  };
  $('#bEdit').onclick = () => {
    const m = h('div', 'modal');
    m.innerHTML = `<div class="box"><h3 style="margin-top:0">문제 편집</h3>
      <p style="color:var(--muted);margin-top:0">한 줄에 한 문제. 맨 앞에 정답 <b>O</b> 또는 <b>X</b>를 쓰고 한 칸 띄운 뒤 문제를 적으세요.</p>
      <textarea></textarea><div class="row"><span style="margin-right:auto;color:var(--muted)" id="qcount"></span><button>취소</button><button class="primary">저장</button></div></div>`;
    const ta = $('textarea', m);
    ta.value = questions.map(q => q.answer + ' ' + q.text).join('\n');
    const upd = () => $('#qcount', m).textContent = parseQ(ta.value).length + '문제';
    ta.oninput = upd; upd();
    const [bc, bs] = m.querySelectorAll('.row button');
    bc.onclick = () => m.remove();
    bs.onclick = () => { questions = parseQ(ta.value); localStorage.setItem('ox_questions_' + GAME_ID, ta.value); m.remove(); render(); toast(questions.length + '문제 저장됨'); };
    document.body.append(m);
  };

  /* 이름표(칩) 애니메이션 */
  const chips = {};
  let armedKill = null;
  function zoneRect(zone) {
    const W = arena.clientWidth, H = arena.clientHeight;
    const pad = 70;
    if (zone === 'lobby') return [W * 0.02 + pad, W * 0.70 - pad, pad, H - pad / 2];
    if (zone === 'O') return [pad, W * 0.42 - pad, pad + 40, H - pad / 2];
    if (zone === 'X') return [W * 0.58 + pad, W - pad, pad + 40, H - pad / 2];
    return [W * 0.42 + 50, W * 0.58 - 50, pad + 10, H - pad / 2];
  }
  function newTarget(c) {
    const [x1, x2, y1, y2] = zoneRect(c.zone);
    c.tx = x1 + Math.random() * Math.max(1, x2 - x1);
    c.ty = y1 + Math.random() * Math.max(1, y2 - y1);
    c.next = Date.now() + 1500 + Math.random() * 3000;
  }
  function sync() {
    const all = allPlayers();
    const phase = game ? game.phase : 'lobby';
    // 제거된 참가자
    Object.keys(chips).forEach(id => { if (!all[id]) { chips[id].el.remove(); delete chips[id]; } });
    const n = Object.keys(all).length;
    arena.style.setProperty('--chip-fs', n > 300 ? '12px' : n > 220 ? '13px' : n > 140 ? '15px' : n > 70 ? '17px' : '20px');
    arena.style.setProperty('--av', n > 300 ? '24px' : n > 220 ? '28px' : n > 140 ? '32px' : n > 70 ? '38px' : '46px');
    arena.classList.toggle('crowd', n > 220);
    Object.entries(all).forEach(([id, p]) => {
      let c = chips[id];
      if (!c) {
        const el = h('div', 'chip' + (p.bot ? ' bot' : ''));
        const img = charImg(p.c), tag = h('span', 'tag');
        el.append(img, tag);
        el.onclick = () => kill(id);
        arena.append(el);
        c = chips[id] = { el, img, tag, ch: p.c, x: arena.clientWidth * 0.35, y: arena.clientHeight * 0.5, zone: null, tx: 0, ty: 0, next: 0 };
      }
      if (c.tag.textContent !== (p.name || '?')) c.tag.textContent = p.name || '?';
      if (c.ch !== p.c) { c.ch = p.c; c.img.src = charSrc(p.c); }
      const side = phase === 'lobby' ? null : (lockedSides && phase !== 'question' && id in lockedSides ? lockedSides[id] : p.side);
      const zone = phase === 'lobby' ? 'lobby' : (side || 'M');
      if (zone !== c.zone) { c.zone = zone; newTarget(c); }
      c.el.className = 'chip' + (p.bot ? ' bot' : '') + (side ? ' side-' + side : '') + (c.dying ? ' out' : '') + (armedKill === id ? ' kill' : '');
      const hide = phase !== 'lobby' && !isAlive(id) && !(c.dying && Date.now() - c.dying < 1300);
      c.el.style.display = hide ? 'none' : '';
    });
  }
  function kill(id) {
    if (armedKill !== id) { armedKill = id; sync(); toast('한 번 더 누르면 "' + (allPlayers()[id] || {}).name + '" 이름을 삭제해요'); setTimeout(() => { if (armedKill === id) { armedKill = null; sync(); } }, 3000); return; }
    armedKill = null;
    if (bots[id]) delete bots[id]; else be.deletePlayer(id);
    sync();
  }
  (function frame() {
    const now = Date.now();
    for (const id in chips) {
      const c = chips[id];
      if (c.el.style.display === 'none') continue;
      if (now > c.next) newTarget(c);
      c.x += (c.tx - c.x) * 0.05; c.y += (c.ty - c.y) * 0.05;
      c.el.style.transform = `translate3d(${c.x}px,${c.y}px,0) translate(-50%,-50%)`;
    }
    requestAnimationFrame(frame);
  })();
  addEventListener('resize', () => Object.values(chips).forEach(newTarget));

  /* 가상 참가자 움직임 (화면 테스트용, 저장소에 쓰지 않음) */
  setInterval(() => {
    if (!game || game.phase !== 'question') return;
    let moved = false;
    for (const id in bots) {
      if (!isAlive(id)) continue;
      if (Math.random() < 0.12) { bots[id].side = Math.random() < 0.5 ? 'O' : 'X'; moved = true; }
    }
    if (moved) sync();
  }, 400);

  /* 화면 갱신 */
  function render() {
    if (!game) return;
    const ph = game.phase, all = allPlayers();
    const alive = aliveList().filter(id => all[id]);
    $('#nAll').textContent = Object.keys(all).length;
    $('#nAlive').textContent = ph === 'lobby' ? Object.keys(all).length : alive.length;
    $('#lobbyCnt').textContent = Object.keys(all).length;
    arena.classList.toggle('lobby', ph === 'lobby');
    $('#lobbyCard').classList.toggle('hidden', ph !== 'lobby');
    $('#timer').classList.toggle('hidden', ph !== 'question');
    $('#qno').textContent = ph === 'lobby' ? '' : 'Q' + game.qNo;
    $('#qtext').textContent = ph === 'lobby' ? 'QR을 찍고 캐릭터와 이름을 정하면 여기에 나타나요' : (game.qText || '');

    // O/X 인원
    const cnt = { O: 0, X: 0 };
    alive.forEach(id => { const s = lockedSides && ph !== 'question' && id in lockedSides ? lockedSides[id] : (all[id] || {}).side; if (s) cnt[s]++; });
    $('#cO').innerHTML = ph === 'lobby' ? '' : cnt.O + '<small>명</small>';
    $('#cX').innerHTML = ph === 'lobby' ? '' : cnt.X + '<small>명</small>';
    if (ph !== 'question') $('#tbar').style.width = ph === 'locked' ? '0%' : '0';

    $('#zO').classList.toggle('correct', ph === 'reveal' && game.answer === 'O');
    $('#zX').classList.toggle('correct', ph === 'reveal' && game.answer === 'X');
    $('#zO').classList.toggle('wrong', ph === 'reveal' && game.answer === 'X');
    $('#zX').classList.toggle('wrong', ph === 'reveal' && game.answer === 'O');

    const more = game.qNo < questions.length;
    const labels = {
      lobby: '게임 시작',
      question: '지금 마감',
      locked: '정답 공개',
      reveal: more ? `다음 문제 (Q${game.qNo + 1})` : '우승자 발표',
      final: '우승자 화면 닫기',
    };
    bMain.innerHTML = ''; bMain.append(document.createTextNode(labels[ph])); bMain.append(h('kbd', null, 'Space'));
    const msg = $('#msg');
    if (ph === 'reveal') msg.textContent = game.allWrong ? '전원 오답이라 아무도 탈락하지 않았어요.' : `정답 ${game.answer} · 생존 ${alive.length}명` + (alive.length <= 3 ? ' — 우승자 발표 가능!' : '');
    else if (ph === 'lobby') msg.textContent = `문제 ${questions.length}개 준비됨` + (be.mode === 'demo' ? '. 데모 모드라 같은 브라우저의 다른 탭에서만 참가할 수 있어요.' : '');
    else if (ph === 'question') msg.textContent = '';

    // 우승 화면
    let fin = $('.final');
    if (ph === 'final') {
      if (!fin) {
        fin = h('div', 'final');
        fin.append(h('h1', null, '최후의 생존자'));
        const wn = (game.winners || []).length;
        fin.append(h('div', 'sub', wn > 1 ? `${wn}명이 끝까지 살아남았어요` : '축하합니다!'));
        const names = h('div', 'names' + (wn > 24 ? ' many' : ''));
        (game.winners || []).forEach(w => { const sp = h('span'); sp.append(charImg(w.c), document.createTextNode(w.name)); names.append(sp); });
        if (!(game.winners || []).length) names.append(h('span', null, '생존자 없음'));
        fin.append(names);
        const cl = h('button', 'close', '닫기'); cl.onclick = () => save({ phase: 'reveal' }); fin.append(cl);
        const colors = ['#F5B800', '#FFFFFF', '#1E5EFF', '#EE3346', '#10A15A'];
        for (let i = 0; i < 90; i++) {
          const c = h('div', 'confetti');
          c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
          c.style.animationDuration = 3 + Math.random() * 4 + 's'; c.style.animationDelay = -Math.random() * 6 + 's';
          fin.append(c);
        }
        document.body.append(fin);
      }
    } else if (fin) fin.remove();
    sync();
  }
  // "문제 끝" 상태에서 메인 버튼은 우승자 발표
  const origMain = bMain.onclick;
  bMain.onclick = () => { if (game && game.phase === 'reveal' && game.qNo >= questions.length) finale(); else origMain(); };

  be.watchPlayers(m => { players = m; render(); });
  be.watchGame(g => {
    if (!g) { save({ phase: 'lobby' }); return; }        // 처음 열 때 게임 방 생성
    if (g.hostUid && g.hostUid !== be.uid && be.mode === 'firebase') toast('다른 기기가 이 게임의 진행자예요.', 6000);
    const keep = game; game = g;
    if (keep && keep.phase === 'question' && g.phase === 'question') { /* 내 타이머 유지 */ }
    render();
  });
}

/* ───────── 시작 ───────── */
makeBackend(isHost).then(be => isHost ? startHost(be) : startPlayer(be)).catch(e => {
  console.error(e);
  app.innerHTML = '';
  app.append(h('div', 'p-center', '연결에 실패했어요: ' + (e.code || e.message)));
});
</script>
</body>
</html>
